# Primary run config (Phi-3.5-mini). Requires a 16 GB-class GPU.
seed: 42
model:
  id: microsoft/Phi-3.5-mini-instruct
  revision: 2fe192450127e6a83f7441aef6e3ca586c338b77
  dtype: float16
  device: cuda
layer:
  # Set automatically by `trait-mtmm phase4` / extract when validation passes.
  # Frozen 2026-11-17 from Kaggle extract (gate v2 passed).
  L_star: 17
vectors:
  # SHA-256 of results/extract/trait_vectors.pt from the 2026-11-19 Kaggle re-run
  # of phase4 at 675f7f6 (gate v2 passed; reproduces 2026-11-17). The main run
  # refuses to start without a matching file.
  sha256: 5e12b0ba04f6b2a7f09355e9156795629b689bdf0739a1ae2c44af185ca402ca
paths:
  stimuli_dir: stimuli
  results_dir: results
  figures_dir: figures
scoring:
  # Prompt format finalized on extract/dev only (Phase 4). Log changes in DECISIONS.md.
  # Attempt 1: digits + "Answer:" / empty prefill → ~0 option mass on Phi-3.5-mini.
  # Attempt 2: letters A–E (same 1–5 Likert values), empty prefill.
  assistant_prefill: ""
  sr_format: letters
  min_option_mass_dev: 0.80
  drop_item_option_mass: 0.50
  drop_condition_item_frac: 0.20
analysis:
  bootstrap_n: 10000
  bootstrap_seed: 42
  null_vectors: 1000
  alpha: 0.05
