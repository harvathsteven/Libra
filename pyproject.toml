[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libra"
version = "0.1.0"
description = "Libra: zero-cost construct-validity pilot of SR, BC, and IP LLM personality measures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steven Harvath" }]
dependencies = [
  "torch",
  "transformers>=4.44",
  "datasets",
  "numpy",
  "pandas",
  "scipy",
  "pyarrow",
  "matplotlib",
  "pyyaml",
  "accelerate",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trait-mtmm = "trait_mtmm.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not slow'"
markers = [
  "slow: end-to-end smoke runs that load the model",
]
